<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Emkhatsini Specials</title>
<link rel="stylesheet" href="styles.css">
</head>
<body>
  <header>
    <h1>Emkhatsini Specials</h1>
    <p class="dates">Prices valid 3 August &ndash; 6 September 2026</p>
  </header>

  <main class="slideshow">
    <div class="slides">
      <div class="slide active">
        <img src="assets/slide-1.jpg" alt="Emkhatsini specials flyer page 1">
      </div>
      <div class="slide">
        <img src="assets/slide-2.jpg" alt="Emkhatsini specials flyer page 2">
      </div>
      <div class="slide">
        <img src="assets/slide-3.jpg" alt="Emkhatsini specials flyer page 3">
      </div>
      <div class="slide">
        <img src="assets/slide-4.jpg" alt="Emkhatsini specials flyer page 4">
      </div>
    </div>

    <button class="nav prev" aria-label="Previous slide">&#10094;</button>
    <button class="nav next" aria-label="Next slide">&#10095;</button>

    <div class="dots">
      <span class="dot active" data-index="0"></span>
      <span class="dot" data-index="1"></span>
      <span class="dot" data-index="2"></span>
      <span class="dot" data-index="3"></span>
    </div>
  </main>

  <footer>
    <p>Emkhatsini &mdash; specials shared for personal use.</p>
  </footer>

  <script src="script.js"></script>
</body>
</html>
